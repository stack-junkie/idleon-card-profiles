name: Checks and Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Check version and run tests
        run: |
          npm run version:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          exit $LASTEXITCODE
      - name: Build installer
        run: ./scripts/build-installer.ps1
      - name: Test packaged runtime and launcher
        run: ./packaging/test-packaging.ps1
      - name: Package source
        run: ./scripts/package.ps1
      - name: Upload test installer and source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: idleon-card-profiles-windows-test-build
          path: |
            ../output/IdleonCardProfiles-Setup.exe
            ../output/idleon-card-profiles-*-win-x64.zip
            ../output/idleon-card-profiles-*-source.zip
          if-no-files-found: error
          retention-days: 14
